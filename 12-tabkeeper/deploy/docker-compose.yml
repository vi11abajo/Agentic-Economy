# Lives in /opt/x402-sellers on the server, next to app/ (git clone of the repository), .env (SELLER_PRIVATE_KEY) and data/.
services:
  x402-sellers:
    build:
      context: ./app
      dockerfile: 12-tabkeeper/deploy/Dockerfile
    image: x402-sellers:latest
    container_name: x402-sellers
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:18612:8080" # only nginx on the host reaches it
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
