# /etc/nginx/sites-available/mcp.pharosfdv.xyz  (certbot --nginx adds the 443/ssl part)
server {
    listen 80;
    server_name mcp.pharosfdv.xyz;

    location = / { return 302 /prosper-monitor; }

    # Live feed stream (Server-Sent Events): no buffering, long-lived.
    location = /prosper-monitor/stream {
        proxy_pass http://127.0.0.1:18611;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Feed page, JSON and the MCP endpoint (/prosper-monitor/mcp).
    location /prosper-monitor {
        proxy_pass http://127.0.0.1:18611;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / { return 404; }
}
