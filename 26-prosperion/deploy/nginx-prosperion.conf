# /etc/nginx/sites-available/prosperion.pharosfdv.xyz
# Pages are static files; /api/ goes to the node service. The MCP port (18621) and Hermes (8642) stay on
# 127.0.0.1 and are never exposed here. The certbot lines are kept as certbot wrote them.
server {
    server_name prosperion.pharosfdv.xyz;
    root /opt/prosperion/www;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:18620;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The chat answer streams token by token; buffering would hold it until the end.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /wallet-test/ { try_files $uri $uri/index.html =404; add_header Cache-Control "no-store"; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/prosperion.pharosfdv.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/prosperion.pharosfdv.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = prosperion.pharosfdv.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name prosperion.pharosfdv.xyz;
    listen 80;
    return 404; # managed by Certbot
}
